# IDP Portal CI — runs from repo root (GitHub only uses .github/ at root)
# Moved from idp-portal/.github/workflows/ci.yml; all paths prefixed with idp-portal/

name: CI

on:
  push:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Django Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.8
      - name: Run ruff
        working-directory: idp-portal/django_backend
        run: ruff check .

  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: idp-portal/frontend
        run: npm ci
      - name: Run ESLint
        working-directory: idp-portal/frontend
        run: npm run lint

  verify-lockfiles:
    name: Verify Lockfiles Up-to-Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Verify requirements.lock is up-to-date
        working-directory: idp-portal/django_backend
        run: |
          uv pip compile pyproject.toml -o requirements.lock.check --python-version 3.12
          diff -u requirements.lock requirements.lock.check || {
            echo "❌ requirements.lock is out of date! Run: uv pip compile pyproject.toml -o requirements.lock --python-version 3.12"
            exit 1
          }
      - name: Verify requirements-dev.lock is up-to-date
        working-directory: idp-portal/django_backend
        run: |
          uv pip compile pyproject.toml --extra dev -o requirements-dev.lock.check --python-version 3.12
          diff -u requirements-dev.lock requirements-dev.lock.check || {
            echo "❌ requirements-dev.lock is out of date! Run: uv pip compile pyproject.toml --extra dev -o requirements-dev.lock --python-version 3.12"
            exit 1
          }

  typecheck-backend:
    name: Type Check Django Backend (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: idp-portal/django_backend
        run: uv pip install -r requirements-dev.lock --system
      - name: Run mypy type check (strict, blocking)
        working-directory: idp-portal/django_backend
        run: mypy . --no-error-summary

  typecheck-frontend:
    name: Type Check Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: idp-portal/frontend
        run: npm ci
      - name: Run TypeScript compiler
        working-directory: idp-portal/frontend
        run: npx tsc -b --noEmit

  test-backend:
    name: Test Django Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: idp-portal/django_backend
        run: uv pip install -r requirements-dev.lock --system
      - name: Run pytest
        working-directory: idp-portal/django_backend
        env:
          DJANGO_SETTINGS_MODULE: idp_backend.settings
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest tests/ -v --ignore=tests/integration/

  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: idp-portal/frontend
        run: npm ci
      - name: Run vitest with coverage
        working-directory: idp-portal/frontend
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: idp-portal/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: idp-portal/frontend/coverage/
          retention-days: 7

  build-frontend:
    name: Build Frontend (vite)
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: idp-portal/frontend
        run: npm ci
      - name: Build
        working-directory: idp-portal/frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: idp-portal/frontend/dist
          retention-days: 7

  # =============================================================
  # Security Scanning Jobs (Story 15.1)
  # =============================================================

  security-functional-tests:
    name: Security Functional Tests (pytest -m security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: idp-portal/django_backend
        run: uv pip install -r requirements-dev.lock --system
      - name: Run security functional tests
        working-directory: idp-portal/django_backend
        env:
          DJANGO_SETTINGS_MODULE: idp_backend.test_settings
        run: |
          mkdir -p security-reports
          pytest tests/security/ -v -m security \
            --tb=short \
            --junitxml=security-reports/security-tests.xml \
            2>&1 | tee security-reports/security-tests.log
      - name: Upload security test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-functional-tests-report
          path: idp-portal/django_backend/security-reports/
          retention-days: 30

  security-sast-backend:
    name: SAST Backend (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit[toml]>=1.7.5
      - name: Run Bandit security analysis
        working-directory: idp-portal/django_backend
        run: |
          mkdir -p security-reports
          bandit -r . -c pyproject.toml -f json -o security-reports/bandit-report.json || true
          bandit -r . -c pyproject.toml -f html -o security-reports/bandit-report.html || true
          bandit -r . -c pyproject.toml -f txt --severity-level medium
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: idp-portal/django_backend/security-reports/
          retention-days: 30

  security-dependencies-backend:
    name: Dependency Scan Backend (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit>=2.7.0
      - name: Install uv
        run: pip install uv
      - name: Install project dependencies
        working-directory: idp-portal/django_backend
        run: uv pip install -r requirements.lock --system
      - name: Run pip-audit
        working-directory: idp-portal/django_backend
        run: |
          mkdir -p security-reports
          pip-audit --format json --output security-reports/pip-audit-report.json || true
          pip-audit --format markdown --output security-reports/pip-audit-report.md || true
          pip-audit --strict --desc on
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-security-report
          path: idp-portal/django_backend/security-reports/
          retention-days: 30

  security-dependencies-frontend:
    name: Dependency Scan Frontend (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: idp-portal/frontend
        run: npm ci
      - name: Run npm audit
        working-directory: idp-portal/frontend
        run: |
          mkdir -p security-reports
          npm audit --json > security-reports/npm-audit-report.json || true
          npm audit --audit-level=moderate
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-security-report
          path: idp-portal/frontend/security-reports/
          retention-days: 30

  security-secrets:
    name: Secret Detection (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install detect-secrets>=1.5.0
      - name: Scan for secrets
        run: |
          mkdir -p security-reports
          detect-secrets scan --all-files > security-reports/secrets-scan.json || true
          if [ -f idp-portal/.secrets.baseline ]; then
            detect-secrets audit --report idp-portal/.secrets.baseline || true
          fi
          detect-secrets scan --all-files 2>&1 | tee security-reports/secrets-scan.txt
      - name: Upload secrets scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-scan-report
          path: security-reports/
          retention-days: 30
