workflows:
  create-story:
    prompt_template: "/bmad_bmm_create-story - Create story: {{.StoryKey}}. Do not ask questions."
    model: "sonnet"  # Optional: specify model for this workflow

  validate-story:
    prompt_template: "/bmad_bmm_create-story -v - Validate story: {{.StoryKey}}. Do not ask questions."
    model: "sonnet"  # Optional: specify model for this workflow

  dev-story:
    prompt_template: "/bmad_bmm_dev-story - Work on story: {{.StoryKey}}. Complete all tasks. Run tests after each implementation. Do not ask clarifying questions - use best judgment based on existing patterns."
    model: "opus"  # Optional: specify model for development (e.g., "opus" for creative coding)

  code-review:
    prompt_template: "/bmad_bmm_code-review - Review story: {{.StoryKey}}. When presenting fix options, always choose to auto-fix all issues immediately. Do not wait for user input."
    model: "sonnet"  # Optional: specify model for code review (e.g., "sonnet" for thorough review)

  git-commit:
    prompt_template: "Commit all changes for story {{.StoryKey}} with a descriptive commit message following conventional commits format. Then push to the current branch. Do not ask questions."
    model: "sonnet"  # Optional: specify model for git operations

full_cycle:
  steps:
    - create-story
    - validate-story
    - dev-story
    - code-review
    - git-commit

claude:
  output_format: stream-json
  binary_path: claude

output:
  truncate_lines: 20
  truncate_length: 60
