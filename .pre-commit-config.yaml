# Pre-commit hooks — repository root
# Install: pip install pre-commit && pre-commit install
# Run:    pre-commit run --all-files

repos:
  # Secret detection (idp-portal). Excludes tests, docs, .env*, templates (common false positives).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', 'idp-portal/.secrets.baseline']
        files: ^idp-portal/
        exclude: |
          (?x)^idp-portal/(
            .*\.lock$|
            package-lock\.json$|
            .*node_modules/.*|
            .*\.venv/.*|
            .*security-reports/.*|
            \.env$|\.env\.|.*\.env\.(development|production|example|template)$|
            .*/docs/.*|
            .*/tests?/.*|
            .*test_.*\.py$|.*_test\.py$|
            .*conftest\.py$|
            .*test_settings\.py$|
            .*\.template$|
            .*\.md$
          )$

  # Ruff (Django backend): lint + auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^idp-portal/django_backend/.*\.py$

  # ESLint (frontend): runs on staged .ts/.tsx/.js/.jsx files
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: "bash -c 'if [ ! -d idp-portal/frontend/node_modules ]; then echo \"Skip eslint (no node_modules). Install: cd idp-portal/frontend && npm install\"; exit 0; fi; cd idp-portal/frontend && npm run lint'"
        language: system
        files: ^idp-portal/frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # TypeScript type check (frontend)
  - repo: local
    hooks:
      - id: typecheck-frontend
        name: typecheck (frontend)
        entry: "bash -c 'if [ ! -d idp-portal/frontend/node_modules ]; then echo \"Skip typecheck (no node_modules). Install: cd idp-portal/frontend && npm install\"; exit 0; fi; cd idp-portal/frontend && npm run typecheck'"
        language: system
        files: ^idp-portal/frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # Mypy (Django backend): runs at commit using project venv (Django plugin needs project settings).
  - repo: local
    hooks:
      - id: mypy-django-backend
        name: mypy (django_backend)
        entry: "bash -c 'V=idp-portal/django_backend/.venv/bin/python; if [ -x \"$V\" ] && \"$V\" -c \"import mypy\" 2>/dev/null; then \"$V\" -m mypy --config-file=idp-portal/django_backend/pyproject.toml --no-error-summary idp-portal/django_backend; else echo \"Skip mypy (no mypy in .venv). Install: cd idp-portal/django_backend && uv sync --extra dev\"; fi'"
        language: system
        files: ^idp-portal/django_backend/.*\.py$
        pass_filenames: false
