# IDP Portal Nginx Configuration
# TLS termination and reverse proxy to Django backend (Gunicorn)

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Configuration
    # NOTE: These paths must be configured per environment
    # Update these paths to match your SSL certificate locations
    ssl_certificate /etc/ssl/certs/idp-portal.crt;
    ssl_certificate_key /etc/ssl/private/idp-portal.key;

    # TLS 1.2+ only (AC #5)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (AC #5)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root for static files
    # NOTE: This path must match the deployment path configured in deploy.sh
    # Default: /var/www/idp-portal/frontend/dist
    root /var/www/idp-portal/frontend/dist;
    index index.html;

    # Frontend static files (AC #5)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Django/Gunicorn (AC #5)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy (AC #5)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket specific timeouts
    # NOTE: 7 days timeout allows long-lived WebSocket connections for real-time execution timeline
    # This matches the architecture requirement for execution monitoring (AC #4, Epic 4)
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    }

    # Health check endpoint (no auth required)
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Logging
    access_log /var/log/nginx/idp-portal.access.log;
    error_log /var/log/nginx/idp-portal.error.log;
}
