# Pre-commit hooks for idp-portal (when run from idp-portal directory)
# For repo root (recommended): use the root .pre-commit-config.yaml and run "pre-commit install" from repo root.
# Story 15.1: Secret detection | Story 26.16: mypy enforcement

repos:
  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.lock$|
            package-lock\.json$|
            .*node_modules/.*|
            .*\.venv/.*|
            .*security-reports/.*
          )$

  # Mypy type check (Django backend) — blocks commit on error
  - repo: local
    hooks:
      - id: mypy
        name: mypy (django_backend)
        entry: bash -c 'cd django_backend && mypy . --config-file=pyproject.toml --no-error-summary'
        language: system
        types: [python]
        files: ^django_backend/.*\.py$
        pass_filenames: false
