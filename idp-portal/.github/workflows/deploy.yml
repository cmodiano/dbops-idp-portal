name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  lint-backend:
    name: Lint Django Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.8
      - name: Run ruff
        working-directory: django_backend
        run: ruff check .

  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  typecheck-backend:
    name: Type Check Django Backend (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: django_backend
        run: |
          uv pip install -r requirements-dev.lock --system
          pip install django-stubs djangorestframework-stubs
      - name: Run mypy type check (strict, blocking)
        working-directory: django_backend
        run: mypy . --no-error-summary

  typecheck-frontend:
    name: Type Check Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run TypeScript compiler
        working-directory: frontend
        run: npx tsc -b --noEmit

  test-backend:
    name: Test Django Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: django_backend
        run: uv pip install -r requirements-dev.lock --system
      - name: Run pytest
        working-directory: django_backend
        env:
          DJANGO_SETTINGS_MODULE: idp_backend.settings
          DATABASE_URL: sqlite:///:memory:
        run: pytest tests/ -v --ignore=tests/integration/

  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run vitest
        working-directory: frontend
        run: npm test

  build-frontend:
    name: Build Frontend (vite)
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Copy environment file
        working-directory: frontend
        run: |
          ENV=${{ github.event.inputs.environment || 'staging' }}
          if [ -f ".env.${ENV}" ]; then
            cp ".env.${ENV}" .env
            echo "✅ Using .env.${ENV} for build"
          else
            echo "⚠️ No .env.${ENV} found, using defaults"
          fi
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify build output
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "❌ Build failed: frontend/dist/index.html not found"
            exit 1
          fi
          echo "✅ Build output verified"

  deploy:
    name: Deploy Django to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'staging') || 'staging' }}
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, typecheck-backend, typecheck-frontend, test-backend, test-frontend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'staging') || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine deploy environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy environment file
        working-directory: frontend
        run: |
          ENV=${{ steps.env.outputs.target }}
          if [ -f ".env.${ENV}" ]; then
            cp ".env.${ENV}" .env
            echo "✅ Using .env.${ENV} for build"
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # Verify build output exists
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Backup current release
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             cp -a django_backend django_backend.bak 2>/dev/null || true && \
             cp -a frontend/dist frontend/dist.bak 2>/dev/null || true"

      - name: Deploy frontend via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/dist/

      # Django backend deployment
      - name: Deploy Django backend via rsync
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache' \
            --exclude 'tests/' \
            --exclude '.env*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            django_backend/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/django_backend/

      # Install deps, migrate, restart
      - name: Restart Django service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }}/django_backend && \
             pip install uv && uv pip install -r requirements.lock --system && \
             python manage.py collectstatic --noinput && \
             python manage.py migrate --check && \
             sudo systemctl restart idp-django" || {
              echo "❌ Failed to restart idp-django service"
              ssh -i ~/.ssh/deploy_key \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                "sudo systemctl status idp-django || true"
              exit 1
            }

      - name: Health check
        id: healthcheck
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -sf http://localhost:8000/api/v1/health || exit 1"
          echo "✅ Health check passed"

      - name: Run smoke tests
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             bash scripts/post-switchover-validation.sh --api-url http://localhost:8000" || {
              echo "⚠️ Smoke tests failed — deployment succeeded but validation concerns detected"
              echo "Review logs above for details"
              exit 1
            }

      - name: Rollback on health check failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "⚠️ Health check failed — rolling back to previous release"
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             rm -rf django_backend && mv django_backend.bak django_backend 2>/dev/null || true && \
             rm -rf frontend/dist && mv frontend/dist.bak frontend/dist 2>/dev/null || true && \
             cd django_backend && \
             uv pip install -r requirements.lock --system && \
             sudo systemctl restart idp-django"
          echo "✅ Rollback completed with dependency restoration"
