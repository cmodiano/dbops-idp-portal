# Django Backend Tests
# Story M.9: Tests unitaires et d'intégration
#
# This workflow runs Django tests on every push and PR.

name: Django Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'django_backend/**'
      - '.github/workflows/django-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'django_backend/**'
      - '.github/workflows/django-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('django_backend/requirements-dev.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: django_backend
      run: uv pip install -r requirements-dev.lock --system

    - name: Run unit tests with coverage
      working-directory: django_backend
      run: |
        pytest -m "not slow and not benchmark and not integration" \
          --cov=catalog --cov=profiles --cov=integrations \
          --cov=executions --cov=idp_auth --cov=core \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=80 \
          -v

    - name: Run integration tests
      working-directory: django_backend
      run: |
        pytest -m integration -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: django_backend/coverage.xml
        flags: django-backend
        name: django-coverage
        fail_ci_if_error: false

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: django_backend/htmlcov/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff linter
      working-directory: django_backend
      run: ruff check .

  type-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      working-directory: django_backend
      run: |
        uv pip install -r requirements-dev.lock --system
        pip install django-stubs djangorestframework-stubs

    - name: Run mypy type checker
      working-directory: django_backend
      run: mypy --ignore-missing-imports .
      continue-on-error: true  # Type checking is advisory for now
