[project]
name = "idp-portal-backend"
version = "0.1.0"
description = "IDP Portal - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "oracledb>=3.4.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "structlog>=24.0",
    "cachetools>=5.0",
    "python3-saml>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 120
target-version = "py311"
