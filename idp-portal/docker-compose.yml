services:
  # ==========================================================================
  # Container 0: Redis (Broker Celery — Story 47.1)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: idp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - idp-network
    restart: unless-stopped

  # ==========================================================================
  # Container 1: Oracle Database 23ai Free Edition
  # ==========================================================================
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: dbops-oracle
    hostname: oracle-db

    environment:
      - ORACLE_PWD=Oracle123!
      - ORACLE_CHARACTERSET=AL32UTF8
      # Enable APEX (pre-installed in 23ai)
      - ENABLE_APEX=true

    ports:
      - "1521:1521"    # SQL*Net
      - "5500:5500"    # EM Express

    volumes:
      - oracle-data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s sys/Oracle123!@//localhost:1521/FREEPDB1 as sysdba | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

    networks:
      - idp-network
    restart: unless-stopped

  # ==========================================================================
  # Container 2: Backend Django (Gunicorn)
  # ==========================================================================
  backend:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    container_name: idp-backend
    hostname: backend

    environment:
      - DJANGO_SETTINGS_MODULE=idp_backend.settings
      - DEBUG=true
      - AUTH_DEV_BYPASS=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production
      - ALLOWED_HOSTS=*
      - CORS_ORIGIN=http://localhost:8080
      - ORACLE_DSN=oracle-db:1521/FREEPDB1
      - ORACLE_USER=IDP_APP
      - ORACLE_PASSWORD=Oracle123!
      - DJANGO_LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - SIMULATE_EXECUTION_DEV=true
      - SIMULATE_EXECUTION_STEP_DURATION=4
      # Cache applicatif local (indépendant du broker Celery Redis déjà inclus).
      # Pour utiliser Redis comme cache applicatif : CACHE_BACKEND=redis
      - CACHE_BACKEND=locmem
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Execution synchrone des taches Celery en dev
      - CELERY_TASK_ALWAYS_EAGER=true


    ports:
      - "8000:8000"

    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - idp-network
    restart: unless-stopped

  # ==========================================================================
  # Container 3: Celery Worker (Story 47.1 — queues dédiées par plateforme)
  # ==========================================================================
  celery-worker:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    container_name: idp-celery-worker
    # Worker unique consommant toutes les queues (bulkhead pattern — défaut recommandé)
    command: celery -A idp_backend worker -Q aap,azure,github,terraform,default --concurrency=4 -n worker@%h
    # Option avancée — Workers dédiés par plateforme (isolation stricte) :
    # Pour activer : commenter la ligne command: ci-dessus, décommenter UN seul service ci-dessous,
    # puis dupliquer ce service pour chaque plateforme voulue dans un compose override.
    # Exemple de commandes dédiées (à utiliser dans des services séparés) :
    #   celery -A idp_backend worker -Q aap --concurrency=4 -n worker-aap@%h
    #   celery -A idp_backend worker -Q azure --concurrency=2 -n worker-azure@%h
    #   celery -A idp_backend worker -Q github --concurrency=2 -n worker-github@%h
    #   celery -A idp_backend worker -Q terraform --concurrency=2 -n worker-terraform@%h

    environment:
      - DJANGO_SETTINGS_MODULE=idp_backend.settings
      - DEBUG=true
      - AUTH_DEV_BYPASS=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production
      - ALLOWED_HOSTS=*
      - ORACLE_DSN=oracle-db:1521/FREEPDB1
      - ORACLE_USER=IDP_APP
      - ORACLE_PASSWORD=Oracle123!
      - DJANGO_LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "celery", "-A", "idp_backend", "inspect", "ping", "-d", "worker@%h", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - idp-network
    restart: unless-stopped

  # ==========================================================================
  # Container 4: Celery Beat (planificateur des tâches périodiques)
  # ⚠️ Celery Beat DOIT tourner en une seule instance (éviter doublons de tâches)
  # Tâches planifiées : evaluate-waiting-gates, process-pending-scheduled-executions,
  #                     health-check-all-integrations
  # ==========================================================================
  celery-beat:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    container_name: idp-celery-beat
    user: root  # Required: volume /var/lib/celery is root-owned; idp user cannot write schedule file
    command: celery -A idp_backend beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - celery-beat-data:/var/lib/celery
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=idp_backend.settings
      - DEBUG=true
      - AUTH_DEV_BYPASS=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - ALLOWED_HOSTS=*
      - ORACLE_DSN=oracle-db:1521/FREEPDB1
      - ORACLE_USER=IDP_APP
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-Oracle123!}
      - DJANGO_LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Optionnel: configurer les intervalles Beat (valeurs par défaut si absents)
      # - CELERY_BEAT_EVALUATE_GATES_INTERVAL=60                         # secondes (défaut: 60)
      # - CELERY_BEAT_PROCESS_SCHEDULED_EXECUTIONS_INTERVAL=60           # secondes (défaut: 60)
      # - CELERY_BEAT_HEALTH_CHECK_INTERVAL=3600                         # secondes (défaut: 3600)
      # Optionnel: configurer via crontab pour prod (priorité sur *_INTERVAL si défini)
      # - CELERY_BEAT_EVALUATE_GATES_CRONTAB="* * * * *"                 # crontab (ex: "*/5 * * * *")
      # - CELERY_BEAT_PROCESS_SCHEDULED_EXECUTIONS_CRONTAB="* * * * *"   # crontab (ex: "*/5 * * * *")
      # - CELERY_BEAT_HEALTH_CHECK_CRONTAB="0 * * * *"                   # crontab (ex: hourly)

    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - idp-network
    restart: unless-stopped

  # ==========================================================================
  # Container 5: Frontend React/Vite (Nginx)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MODE: docker
    container_name: idp-frontend
    hostname: frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - idp-network
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  oracle-data:
    name: dbops-oracle-data
  celery-beat-data:

# ============================================================================
# Réseau
# ============================================================================
networks:
  idp-network:
    name: idp-network
    driver: bridge
