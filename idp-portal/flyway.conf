# Flyway configuration for IDP Portal (Oracle)
# URL, user and password are set by run_migrations.sh from ORACLE_DSN, ORACLE_USER, ORACLE_PASSWORD
# Run from idp-portal/ so that database/migrations is relative to this dir.

flyway.locations=filesystem:database/migrations
flyway.validateOnMigrate=true
# Oracle: Flyway uses flyway_schema_history by default (no custom table)
