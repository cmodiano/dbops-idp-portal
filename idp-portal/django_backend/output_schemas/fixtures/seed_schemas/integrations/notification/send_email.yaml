items:
  - apiVersion: idp/v1
    kind: OutputSchema
    metadata:
      name: notification-send-email
      schema_type: integration
      target_name: notification
      operation: send_email
    spec:
      inherits_from: null
      output_fields:
        - name: status
          path: "$.status"
          type: string
          description: "Statut de l'envoi de l'email (sent, failed)"
          required: true
        - name: recipient
          path: "$.recipient"
          type: string
          description: "Adresse email du destinataire"
          required: false
        - name: message_id
          path: "$.message_id"
          type: string
          description: "Identifiant unique du message envoyé"
          required: false
