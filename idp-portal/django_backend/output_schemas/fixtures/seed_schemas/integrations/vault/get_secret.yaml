items:
  - apiVersion: idp/v1
    kind: OutputSchema
    metadata:
      name: vault-get-secret
      schema_type: integration
      target_name: vault
      operation: get_secret
    spec:
      inherits_from: null
      output_fields:
        - name: secret_key
          path: "$.secret_key"
          type: string
          description: "Clé du secret récupéré depuis Vault"
          required: true
        - name: secret_value
          path: "$.secret_value"
          type: string
          description: "Valeur du secret récupéré depuis Vault"
          required: true
        - name: lease_duration
          path: "$.lease_duration"
          type: integer
          description: "Durée du bail du secret en secondes"
          required: false
