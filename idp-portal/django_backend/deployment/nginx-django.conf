# Nginx configuration for IDP Portal Django Backend
# Location: /etc/nginx/conf.d/idp-django.conf

# Upstream Django backend
upstream idp_django {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=idp_api:10m rate=100r/s;

server {
    listen 443 ssl http2;
    server_name api.idp.internal;

    # SSL/TLS Configuration
    ssl_certificate /etc/ssl/certs/api.idp.internal.pem;
    ssl_certificate_key /etc/ssl/private/api.idp.internal.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (SOC1/NFR6 - Story 15.3)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/idp-django-access.log combined;
    error_log /var/log/nginx/idp-django-error.log warn;

    # Client settings
    client_max_body_size 50M;
    client_body_timeout 60s;

    # API endpoints - proxy to Django
    location /api/ {
        # Rate limiting
        limit_req zone=idp_api burst=50 nodelay;

        # Proxy to Django
        proxy_pass http://idp_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Timeouts for long-running operations (executions)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # WebSocket endpoint for real-time timeline
    location /ws/ {
        proxy_pass http://idp_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Django static files (if served by Django/Nginx)
    location /static/ {
        alias /opt/idp-portal/django_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (no rate limiting)
    location = /api/v1/health {
        proxy_pass http://idp_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.idp.internal;
    return 301 https://$server_name$request_uri;
}
