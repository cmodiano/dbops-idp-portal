# Pre-commit hooks for Django Backend
# Story 17.9: Mypy type checking
# Install: pre-commit install
# Usage: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.10.0'
    hooks:
      - id: mypy
        name: mypy type check
        additional_dependencies:
          - django-stubs==5.2.9
          - djangorestframework-stubs==3.16.8
          - types-requests==2.32.0
          - types-PyYAML==6.0.0
          - types-cachetools==5.3.0
        args: [--config-file=pyproject.toml, --no-error-summary]
        pass_filenames: false
        exclude: '^(migrations|tests|.*\.pyc)/'
        language: python
        types: [python]
