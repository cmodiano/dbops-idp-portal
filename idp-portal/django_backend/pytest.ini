[pytest]
DJANGO_SETTINGS_MODULE = idp_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = .

# Story M.9: Enhanced pytest configuration
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (DB, external services)
    slow: Slow-running tests (>1s)
    benchmark: Performance benchmarks
    security: Security-related tests (RBAC, auth, permissions)
    transaction: Transaction and rollback tests

addopts =
    --strict-markers
    --tb=short
    -v

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
